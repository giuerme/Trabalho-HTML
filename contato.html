<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/735a316080.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/pages.css">
    <title>Contato | Movimento Sem Fome</title>
</head>

<body>
    <a class="skip" href="#conteudo">Ir para o conteúdo</a>
    <header id="navbar-container"><noscript><div class="navbar"><div class="caminhos"><a class="caminhos-link" href="index.html">Início</a><a class="caminhos-link" href="sobre.html">Sobre</a><a class="caminhos-link" href="impacto.html">Impacto</a><a class="caminhos-link" href="projetos.html">Projetos</a><a class="caminhos-link" href="noticias.html">Notícias</a><a class="caminhos-link" href="contato.html">Contato</a></div></div></noscript></header>

    <main class="content" id="conteudo">
        <section>
            <div class="container-resumo hero-sm borda">
                <p>Fale conosco</p>
                <h1>Contato</h1>
                <p>Tire dúvidas, proponha parcerias ou ofereça ajuda.</p>
            </div>
        </section>
        <section class="sec"><h2>Envie uma mensagem</h2><form>
            <label>Nome <input id="nome" type="text" name="nome" required></label>
            <label>E-mail <input id="email" type="email" name="email" required></label>
            <label>Assunto <select id="assunto" name="assunto"><option>Dúvidas sobre o projeto</option><option>Parceria</option><option>Voluntariado</option><option>Outro</option></select></label>
            <label>Mensagem <textarea id="mensagem" name="mensagem" rows="5" required></textarea></label>
            <button class="btn" id="btn-enviar" type="submit">Enviar mensagem</button>
            <p id="resultado" class="ok" role="status" hidden></p>
        </form></section>
    </main>

    <nav class="mais" aria-label="Mais páginas"></nav>
    <footer id="footer-container"></footer>
    <script src="./src/js/main.js"></script>
    <script src="./src/js/form-contato.js"></script>
</body>

</html>
