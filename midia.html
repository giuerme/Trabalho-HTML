<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/735a316080.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/pages.css">
    <title>Mídia | Movimento Sem Fome</title>
</head>

<body>
    <a class="skip" href="#conteudo">Ir para o conteúdo</a>
    <header id="navbar-container"><noscript><div class="navbar"><div class="caminhos"><a class="caminhos-link" href="index.html">Início</a><a class="caminhos-link" href="sobre.html">Sobre</a><a class="caminhos-link" href="impacto.html">Impacto</a><a class="caminhos-link" href="projetos.html">Projetos</a><a class="caminhos-link" href="noticias.html">Notícias</a><a class="caminhos-link" href="contato.html">Contato</a></div></div></noscript></header>

    <main class="content" id="conteudo">
        <section>
            <div class="container-resumo hero-sm borda">
                <p>Vídeo, áudio e mapa</p>
                <h1>Mídia</h1>
                <p>Conheça o movimento de outras formas.</p>
            </div>
        </section>
        <section class="sec">
            <h2>Vídeo institucional</h2>
                <div class="media">
                    <video controls preload="metadata">
                        <source src="./src/videos/apresentacao.mp4" type="video/mp4">
                        Seu navegador não suporta a execução de vídeos em HTML5.
                    </video>
                </div>
        </section>
        <section class="sec">
            <h2>Áudio</h2>
              <div class="media">
               <audio controls preload="none">
               <source src="./src/audios/audio.mp3" type="audio/mpeg">Seu navegador não suporta áudio.
               </audio>
            </div>
        </section>
        <section class="sec">
            <h2>Onde atuamos</h2>
            <div class="media">
                <iframe title="Mapa de São Paulo" loading="lazy" src="https://www.google.com/maps?q=S%C3%A3o+Paulo&amp;output=embed"></iframe>
            </div>
        </section>
        <p class="nota sec">Coloque seus arquivos em src/videos/ e src/audios/.</p>
    </main>

    <nav class="mais" aria-label="Mais páginas"></nav>
    <footer id="footer-container"></footer>
    <script src="./src/js/main.js"></script>
